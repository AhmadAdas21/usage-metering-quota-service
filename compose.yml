services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: usage_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_app -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://usage_app:local_dev_password@postgres:5432/usage_metering
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - node dist/database/initialize.js && exec node dist/server.js
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10

  example-client:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/examples/document-client.js"]
    init: true
    restart: "no"

volumes:
  postgres_data: