name: usage-metering-tests

services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: usage_metering_test
      POSTGRES_USER: usage_test
      POSTGRES_PASSWORD: local_test_password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U usage_test -d usage_metering_test"
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s