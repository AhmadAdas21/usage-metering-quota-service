name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the project
        run: npm run typecheck

      - name: Start isolated test PostgreSQL
        run: docker compose -f compose.test.yml up -d --wait

      - name: Run unit and integration tests
        run: npm run test:all

      - name: Build and start the application
        run: docker compose up -d --build --wait api

      - name: Run the complete example client
        run: docker compose run --rm example-client

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans
          docker compose -f compose.test.yml down -v --remove-orphans
